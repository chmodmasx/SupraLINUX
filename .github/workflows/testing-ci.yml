name: Testing CI

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select affected jobs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      kdeconnect: ${{ steps.select.outputs.kdeconnect }}
      kvm: ${{ steps.select.outputs.kvm }}
      desktop_packages: ${{ steps.select.outputs.desktop_packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Select jobs from Git tree delta
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/select-jobs.py

  static:
    name: Static and contract tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          packages=(apparmor gettext gnupg dpkg-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Run existing test suite
        run: make check

  kdeconnect-sftp:
    needs: plan
    if: needs.plan.outputs.kdeconnect == 'true'
    name: KDE Connect SFTP (Go, Debian binary build)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/apps/supralinux-kdeconnect-sftp
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOFLAGS: -mod=vendor
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper golang-go
      - name: Check Go toolchain and declared dependencies
        run: |
          go version
          dpkg-checkbuilddeps
      - name: Test and build Debian package
        run: dpkg-buildpackage -b -us -uc
      - name: Verify output
        run: |
          shopt -s nullglob
          packages=(../supralinux-kdeconnect-sftp_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"

  desktop-native:
    needs: plan
    if: needs.plan.outputs.desktop_packages != '[]'
    name: Native desktop package (matrix: ${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.desktop_packages) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential dpkg-dev debhelper gettext
      - name: Build and verify native Debian package
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 tools/ci/build-native-deb.py "$PACKAGE" "$RUNNER_TEMP/native-deb"
      - name: Retain verified testing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-deb-${{ matrix.package }}
          path: ${{ runner.temp }}/native-deb/
          if-no-files-found: error
          retention-days: 7

  kvm-capability:
    needs: plan
    if: needs.plan.outputs.kvm == 'true'
    name: KVM infrastructure capability (not product QA)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Check KVM device and permissions
        run: |
          if [ ! -c /dev/kvm ]; then
            echo '::error::INFRA_INVALID: /dev/kvm unavailable'
            exit 1
          fi
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Confirm KVM acceleration through QMP
        run: python3 tools/ci/check-kvm.py
