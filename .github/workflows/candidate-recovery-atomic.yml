name: Candidate atomic recovery backend
on:
  pull_request:
    branches: [testing]
    paths:
      - 'installer/recovery/supralinux-recover.sh'
      - 'tools/qa/recovery-live-metrics.py'
      - 'tools/qa/guest/recovery.sh'
      - '.github/workflows/candidate-recovery-atomic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-recovery-atomic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: testing-iso
          run-id: 45752431633
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Prepare KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          python3 tools/ci/check-kvm.py
      - name: Exercise exact candidate recovery helper
        run: |
          cd "$RUNNER_TEMP/candidate"
          iso=supralinux-aurora-1.0.0-amd64-20261126T041016Z-g58f44e6.iso
          echo "058c11f8e46f7b2e0177208e02e597e139e7e15ad3ce2774708dbfced44207df  $iso" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/tools/qa/recovery-live-metrics.py" "$iso" "$RUNNER_TEMP/recovery" --mode recovery --recovery-source
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-atomic-recovery
          path: ${{ runner.temp }}/recovery/
          if-no-files-found: warn
          retention-days: 7
