name: Testing ISO QA

on:
  pull_request:
    branches: [testing]
    paths:
      - '.github/workflows/testing-iso-qa.yml'
      - 'tools/live/build-testing-iso.sh'
      - 'tools/live/stage-overlays.py'
      - 'tools/ci/boot-live.py'
      - 'tools/ci/build-native-deb.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-iso-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlays:
    name: 'Build ISO overlay (${{ matrix.package }})'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [supralinux-defaults, supralinux-calamares-config, supralinux-kdeconnect-sftp]
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOFLAGS: -mod=vendor
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install build dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          sudo apt-get update
          deps=(build-essential dpkg-dev debhelper gettext)
          if [[ "$PACKAGE" == supralinux-kdeconnect-sftp ]]; then deps+=(golang-go); fi
          sudo apt-get install -y --no-install-recommends "${deps[@]}"
      - name: Build verified overlay
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 tools/ci/build-native-deb.py "$PACKAGE" "$RUNNER_TEMP/overlay"
      - uses: actions/upload-artifact@v4
        with:
          name: iso-overlay-${{ matrix.package }}
          path: ${{ runner.temp }}/overlay/
          if-no-files-found: error
          retention-days: 3

  iso:
    needs: overlays
    name: Build testing ISO
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: iso-overlay-*
          path: ${{ runner.temp }}/iso-overlays
      - name: Install live builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap uidmap squashfs-tools xorriso mtools dosfstools ubuntu-keyring
          df -h
      - name: Prepare namespace-accessible isolated checkout
        run: |
          set -eu
          umask 022
          qa=$(mktemp -d /var/tmp/supralinux-qa-XXXXXXXX)
          chmod 0755 "$qa"
          echo "QA_WORKSPACE=$qa" >> "$GITHUB_ENV"
          git clone --local --no-hardlinks --no-checkout -- "$GITHUB_WORKSPACE" "$qa/source"
          git -C "$qa/source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$qa/source" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 "$qa/source/tools/live/stage-overlays.py" "$RUNNER_TEMP/iso-overlays" "$qa/staged"
          cp "$qa/staged/overlays.json" "$RUNNER_TEMP/iso-overlays.json"
      - name: Build live rootfs and ISO
        run: |
          set -o pipefail
          cd "$QA_WORKSPACE/source"
          sh tools/live/build-testing-iso.sh "$QA_WORKSPACE/live" "$QA_WORKSPACE/staged" 2>&1 | tee "$RUNNER_TEMP/iso-build.log"
          cd "$QA_WORKSPACE/live/build"
          sha256sum -c ./*.iso.sha256
          cp iso/casper/filesystem.manifest "$RUNNER_TEMP/iso-filesystem.manifest"
      - name: Upload ISO candidate (temporary QA only)
        uses: actions/upload-artifact@v4
        with:
          name: testing-iso
          path: |
            ${{ env.QA_WORKSPACE }}/live/build/*.iso
            ${{ env.QA_WORKSPACE }}/live/build/*.iso.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-iso-build-evidence
          path: |
            ${{ runner.temp }}/iso-build.log
            ${{ runner.temp }}/iso-overlays.json
            ${{ runner.temp }}/iso-filesystem.manifest
          if-no-files-found: warn
          retention-days: 7

  boot:
    needs: iso
    name: 'Boot testing ISO (${{ matrix.mode }})'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, uefi, uefi-secure]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: testing-iso
          path: ${{ runner.temp }}/boot-iso
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          if [ ! -c /dev/kvm ]; then
            echo '::error::INFRA_INVALID: /dev/kvm unavailable'
            exit 1
          fi
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          python3 tools/ci/check-kvm.py
      - name: Verify candidate and boot live desktop
        env:
          MODE: ${{ matrix.mode }}
        run: |
          cd "$RUNNER_TEMP/boot-iso"
          sha256sum -c ./*.iso.sha256
          shopt -s nullglob
          isos=(*.iso)
          test "${#isos[@]}" -eq 1
          python3 "$GITHUB_WORKSPACE/tools/ci/boot-live.py" "${isos[0]}" "$RUNNER_TEMP/live-boot" --mode "$MODE"
      - name: Retain console and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-live-boot-${{ matrix.mode }}
          path: ${{ runner.temp }}/live-boot/
          if-no-files-found: warn
          retention-days: 7
