# QCA9565/AR9565 (WB335) shares its 2.4 GHz radio with Bluetooth.  ath9k
# loads with Bluetooth coexistence disabled and btcoex_enable is read-only
# after load, so the wrapper decides at module-load time.  It only adds the
# parameter when the AR9565 PCI ID (168c:0036) is present.
install ath9k /usr/lib/supralinux/ath9k-load $CMDLINE_OPTS
