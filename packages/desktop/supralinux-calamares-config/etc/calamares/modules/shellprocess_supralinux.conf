---
dontChroot: false
timeout: 300
script:
    - "rm -f /etc/sddm.conf.d/10-supralinux.conf /etc/casper.conf"
    - "rm -f /usr/share/applications/kubuntu-calamares.desktop /usr/share/applications/calamares-launch-oem.desktop"
    - "rm -f /etc/systemd/system/multi-user.target.wants/casper.service /etc/systemd/system/multi-user.target.wants/casper-md5check.service /usr/lib/systemd/system/multi-user.target.wants/casper.service /usr/lib/systemd/system/multi-user.target.wants/casper-md5check.service"
    - "systemctl disable casper.service casper-md5check.service 2>/dev/null || true"
    - "systemctl disable smbd nmbd 2>/dev/null || true"
    - "systemctl enable sddm systemd-resolved NetworkManager"
    - "rm -f /etc/grub.d/40_supralinux_recovery"
    - "systemctl disable supralinux-recovery.service 2>/dev/null || true"
    - "rm -f /etc/systemd/system/supralinux-recovery.service /usr/local/sbin/supralinux-recover"
    - "systemctl daemon-reload 2>/dev/null || true"
    - "sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=5/; s/^GRUB_TIMEOUT_STYLE=.*/GRUB_TIMEOUT_STYLE=menu/' /etc/default/grub"
    - "grep -q '^GRUB_TIMEOUT=' /etc/default/grub || echo 'GRUB_TIMEOUT=5' >> /etc/default/grub"
    - "grep -q '^GRUB_TIMEOUT_STYLE=' /etc/default/grub || echo 'GRUB_TIMEOUT_STYLE=menu' >> /etc/default/grub"
    - "grep -q '^GRUB_DISABLE_OS_PROBER=' /etc/default/grub || echo 'GRUB_DISABLE_OS_PROBER=false' >> /etc/default/grub"
    - 'sed -i -e "\|/boot/efi| s/defaults/umask=0077/" /etc/fstab'
    - "grub-mkconfig -o /boot/grub/grub.cfg"
    - "if [ -f /boot/efi/EFI/supralinux/shimx64.efi ]; then install -d -m 0755 /boot/efi/EFI/BOOT; if [ ! -e /boot/efi/EFI/BOOT/BOOTX64.EFI ] || cmp -s /boot/efi/EFI/BOOT/BOOTX64.EFI /boot/efi/EFI/supralinux/grubx64.efi || cmp -s /boot/efi/EFI/BOOT/BOOTX64.EFI /boot/efi/EFI/supralinux/shimx64.efi; then install -m 0644 /boot/efi/EFI/supralinux/shimx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI; install -m 0644 /boot/efi/EFI/supralinux/grubx64.efi /boot/efi/EFI/BOOT/grubx64.efi; install -m 0644 /boot/efi/EFI/supralinux/mmx64.efi /boot/efi/EFI/BOOT/mmx64.efi; install -m 0644 /boot/efi/EFI/supralinux/grub.cfg /boot/efi/EFI/BOOT/grub.cfg; fi; fi"
    - "if [ -f /etc/sddm.conf ]; then sed -i 's/^Session=plasma$/Session=plasma.desktop/' /etc/sddm.conf; fi"
    - "/usr/local/sbin/supralinux-btrfs-setup"
    - "/usr/local/sbin/supralinux-firefox-cleanup"
