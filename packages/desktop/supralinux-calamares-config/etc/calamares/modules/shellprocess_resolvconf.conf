---
# Calamares runs the packages module in the target chroot. The target's
# /etc/resolv.conf points at systemd-resolved's stub, which is not running
# inside the chroot yet, so apt-get update cannot resolve the repositories.
# Give the target the live system's upstream resolvers for the duration of
# the package database update.
dontChroot: true
timeout: 30
script:
    - "if [ -s /run/systemd/resolve/resolv.conf ]; then rm -f ${ROOT}/etc/resolv.conf; install -m 0644 /run/systemd/resolve/resolv.conf ${ROOT}/etc/resolv.conf; else rm -f ${ROOT}/etc/resolv.conf; install -m 0644 /etc/resolv.conf ${ROOT}/etc/resolv.conf; fi"
