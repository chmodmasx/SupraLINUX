---
# The target must have a usable AppStream catalog on first login. This job
# runs after packages, while the live resolver is still in place. When the
# live session has network it refreshes the APT lists (bounded, failure is
# ignored); when offline it still builds the cache from the DEP-11 metadata
# shipped in the ISO. Discover therefore opens with applications instead of
# an empty page on first boot.
dontChroot: false
timeout: 180
script:
    - "if command -v apt-get >/dev/null 2>&1 && command -v getent >/dev/null 2>&1 && timeout 5 getent hosts archive.ubuntu.com >/dev/null 2>&1; then timeout 120 apt-get update -o Acquire::http::Timeout=10 -o Acquire::Retries=0 >/dev/null 2>&1 || true; fi"
    - "if command -v appstreamcli >/dev/null 2>&1; then mkdir -p /var/cache/swcatalog /var/lib/swcatalog; appstreamcli refresh --source=os --force >/dev/null 2>&1 || true; fi"
