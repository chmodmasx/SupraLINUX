---
# Provision the initial KWallet for autologin without LUKS. The helper is
# idempotent: it does nothing when the user chose password login, when the
# root is encrypted (PAM uses the LUKS key), or when a wallet already exists.
dontChroot: false
timeout: 120
script:
    - "/usr/local/sbin/supralinux-kwallet-setup"
