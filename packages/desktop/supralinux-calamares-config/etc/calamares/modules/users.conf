---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - audio
    - bluetooth
    - cdrom
    - dip
    - gamemode
    - i2c
    - lpadmin
    - netdev
    - plugdev
    - render
    - sambashare
    - scanner
    - sudo
    - video
passwordRequirements:
    minLength: 8
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names:
        - root
        - daemon
        - bin
        - sys
        - sync
        - games
        - man
        - lp
        - mail
        - news
        - uucp
        - proxy
        - backup
        - list
        - irc
        - nobody
        - systemd-network
        - systemd-timesync
        - messagebus
        - syslog
        - systemd-resolve
        - sddm
        - polkitd
