# Packages applied inside the installed system after unpackfs. The live
# installer stack, the live media helper and the Calamares launcher must not
# survive into the target. This is an offline-first installer: the target has
# no network dependency. The Spanish and English language packs are already in
# the squashfs; the try_install entries are best-effort for other locales.
# Do not refresh APT lists here: the shellprocess@metadatarefresh job after
# this module does a bounded update when the live session is online and always
# builds the AppStream cache. An offline install still proceeds.
update_db: false
ignore_update_db_error: true
backend: apt
operations:
  - remove:
      # Only installed packages: an offline install has empty APT lists and
      # must still purge these from the dpkg status without network metadata.
      - supralinux-calamares-config
      - calamares-settings-kubuntu
      - calamares-settings-ubuntu-common
      - calamares-settings-ubuntu-common-data
      - calamares
      - calamares-data
      - libcalamaresui3.3
      - cifs-utils
      - casper
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - language-pack-kde-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
