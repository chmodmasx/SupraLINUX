---
# Keep packages that are only "auto" because the live media pulled them in.
# Without this, packages.conf's autoremove would remove cryptsetup and its
# initramfs hook (needed by LUKS installs), finalrd, file and keyutils from
# the target.
dontChroot: false
timeout: 60
script:
    - "apt-mark manual cryptsetup cryptsetup-initramfs finalrd file keyutils || true"
