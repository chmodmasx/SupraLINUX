---
# Persist the mdadm metadata of existing Linux RAID arrays into the target so
# the installed initramfs and mdadm can assemble them after the first boot.
# This does not create or modify arrays; it only reads their metadata.
dontChroot: false
timeout: 60
script:
    - "if command -v mdadm >/dev/null 2>&1; then mkdir -p /etc/mdadm; { echo 'MAILADDR root'; mdadm --examine --scan 2>/dev/null || true; mdadm --detail --scan 2>/dev/null || true; } | sort -u > /etc/mdadm/mdadm.conf; fi"
