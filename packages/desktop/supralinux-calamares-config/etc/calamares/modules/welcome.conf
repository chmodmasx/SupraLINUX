---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    internetCheckUrl:   "https://repo.supralinux.com/"
    requiredStorage:    8
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - root
        - storage
        - ram

geoip:
    # Preselect the language from the country reported by GeoIP. The user can
    # always change it; no network failure blocks the installer.
    style:    "xml"
    url:      "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
