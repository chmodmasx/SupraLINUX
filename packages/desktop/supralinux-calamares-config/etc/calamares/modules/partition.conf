---
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - file
    - small
    - suspend
initialSwapChoice: file
drawNestedPartitions: true
showNotEncryptedBootMessage: false
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]

# "unknown" makes the erase-disk layout honor defaultFileSystemType and the
# ext4/btrfs choice from the UI. Omitting filesystem here means "unformatted".
partitionLayout:
    # LUKS2 con Argon2id no puede desbloquearse desde el GRUB firmado de
    # Ubuntu.  Con cifrado se crea /boot ext4 sin cifrar; GRUB sólo necesita
    # leer /boot y el initramfs desbloquea la raíz LUKS2.  Sin cifrado esta
    # partición no se crea y la raíz sigue ocupando el 100%.
    - name: "supralinux_boot"
      filesystem: "ext4"
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 4G
    - name: "supralinux_root"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
