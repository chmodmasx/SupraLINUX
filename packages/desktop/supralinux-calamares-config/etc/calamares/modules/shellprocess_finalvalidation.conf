---
# Target-only checks; no network dependency. Kept separate from cleanup.
dontChroot: false
timeout: 120
script:
    - |-
      set -eu
      audit=$(dpkg --audit)
      if [ -n "$audit" ]; then
          printf '%s\n' "$audit" >&2
          exit 1
      fi
    - |-
      set -eu
      for package in supralinux-recovery-gui supralinux-calamares-config calamares calamares-data casper; do
          status=$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null) || status=not-installed
          case "$status" in
              not-installed|config-files) ;;
              *) echo "Unexpected live package state: $package ($status)" >&2; exit 1 ;;
          esac
      done
      for path in /etc/polkit-1/rules.d/49-supralinux-recovery.rules /usr/share/polkit-1/actions/com.supralinux.recovery.policy /usr/libexec/supralinux-recovery-helper /usr/local/sbin/supralinux-recover /etc/systemd/system/supralinux-recovery.service /etc/xdg/autostart/supralinux-recovery.desktop; do
          if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Unexpected live-only file: $path" >&2
              exit 1
          fi
      done
    - |-
      set -eu
      apt-cache policy >/dev/null
      test -s /etc/apt/sources.list.d/supralinux.sources
      grep -Eq '^Suites:[[:space:]]+testing[[:space:]]*$' /etc/apt/sources.list.d/supralinux.sources
    - |-
      set -eu
      found=0
      for kernel in /boot/vmlinuz-*; do
          [ -s "$kernel" ] || continue
          version=${kernel#/boot/vmlinuz-}
          if [ -s "/boot/initrd.img-$version" ]; then found=1; break; fi
      done
      if [ "$found" -ne 1 ]; then
          echo 'No matching kernel and initramfs in target' >&2
          exit 1
      fi
      test -s /boot/grub/grub.cfg
      grub-script-check /boot/grub/grub.cfg
    - |-
      set -eu
      grep -Eq '^[0-9a-f]{32}$' /etc/machine-id
      test "$(cat /etc/machine-id)" != 00000000000000000000000000000000
      for unit in sddm.service systemd-resolved.service NetworkManager.service; do
          systemctl is-enabled "$unit" >/dev/null
      done
