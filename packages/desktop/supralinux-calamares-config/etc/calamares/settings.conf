---
modules-search: [ local ]

instances:
- id: preserve
  module: shellprocess
  config: shellprocess_preserve.conf
- id: resolvconf
  module: shellprocess
  config: shellprocess_resolvconf.conf
- id: resolvrestore
  module: shellprocess
  config: shellprocess_resolvrestore.conf
- id: metadatarefresh
  module: shellprocess
  config: shellprocess_metadatarefresh.conf
- id: raid
  module: shellprocess
  config: shellprocess_raid.conf
- id: cleanup
  module: shellprocess
  config: shellprocess_supralinux.conf
- id: kwallet
  module: shellprocess
  config: shellprocess_kwallet.conf
- id: noprompt
  module: shellprocess
  config: shellprocess_noprompt.conf
- id: localecheck
  module: shellprocess
  config: shellprocess_locale.conf
- id: xdgdirs
  module: shellprocess
  config: shellprocess_xdgdirs.conf
- id: keyboardconfig
  module: shellprocess
  config: shellprocess_keyboard.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@preserve
  - shellprocess@resolvconf
  - packages
  - shellprocess@metadatarefresh
  - shellprocess@resolvrestore
  - shellprocess@raid
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@localecheck
  - users
  - shellprocess@keyboardconfig
  - shellprocess@xdgdirs
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - shellprocess@kwallet
  - shellprocess@noprompt
  - umount
- show:
  - finished

branding: supralinux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
